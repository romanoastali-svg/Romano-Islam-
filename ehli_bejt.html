isting application settings and design remain unchanged. */\n.ri-footnote{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-width:23px;height:23px;margin:0 3px;vertical-align:super;border:1px solid #bf9e58;background:#193a30;color:#f1d58e;border-radius:100%;font-size:12px;font-weight:800;line-height:1;cursor:pointer;touch-action:manipulation}\n.ri-footnote:focus-visible,.ri-ref-tile:focus-visible{outline:2px solid #e7c16e;outline-offset:2px}\n.ri-fatiha-note{display:inline-block;margin:5px 0 8px;color:#cdbd92;font-size:12px;line-height:1.5}\n.ri-fatiha-modal{position:fixed;inset:0;z-index:2147482500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.79);padding:12px;box-sizing:border-box}\n.ri-fatiha-modal.ri-active{display:flex}\n.ri-fatiha-panel{width:min(720px,100%);max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:#123227;color:#f7edcf;border:1px solid #bd9b50;border-radius:16px;padding:15px;box-sizing:border-box;box-shadow:0 18px 70px #0009}\n.ri-fatiha-top{display:flex;justify-content:space-between;gap:8px;align-items:center;position:sticky;top:-15px;z-index:2;background:#123227;padding:7px 0 12px;border-bottom:1px solid #6b623d}\n.ri-fatiha-top strong{font-size:18px;color:#f0d28c}.ri-fatiha-close{border:1px solid #b89c61;border-radius:8px;background:#20483b;color:#fff;font-size:15px;padding:8px 13px;cursor:pointer}\n.ri-fatiha-mini{font-size:12px;color:#d7ca9d;line-height:1.6;margin:10px 0}\n.ri-fatiha-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(83px,1fr));gap:8px;margin:12px 0}\n.ri-ref-tile{background:#21463b;border:1px solid #887548;border-radius:9px;color:#fff7e1;padding:8px 5px;cursor:pointer;text-align:center;min-height:58px}\n.ri-ref-tile strong{display:block;font-size:15px}.ri-ref-tile small{display:block;font-size:11px;color:#eccf7e;margin-top:4px;letter-spacing:.08em}\n.ri-ref-tile[aria-pressed=\"true\"]{border-color:#f6d17c;background:#315b48}\n.ri-fatiha-opened{padding:12px 5px;border-top:1px solid #80734c}.ri-fatiha-opened h3{color:#efcf82;margin:3px 0 10px;font-size:16px}.ri-fatiha-ar{direction:rtl;text-align:right;font-family:'Amiri','Noto Naskh Arabic',serif;font-size:clamp(24px,5vw,33px);line-height:1.9;color:#fff6e6;margin:10px 0}\n.ri-fatiha-bs{font-size:17px;line-height:1.8;color:#f5ecd4;white-space:pre-wrap}.ri-fatiha-sources{font-size:13px;color:#e2c47c}\n\u003c/style>\u003cstyle id=\"ri-verse-jump-style\">\n.ri-go-to-verse{display:inline-flex;gap:7px;align-items:center;justify-content:center;margin:11px 0 0;padding:10px 15px;border-radius:10px;border:1px solid #c6a85b;background:#244d3d;color:#f8d98f;font:inherit;font-size:15px;font-weight:700;cursor:pointer;max-width:100%}\n.ri-go-to-verse:focus-visible,.ri-return-to-reference:focus-visible{outline:3px solid #eed795;outline-offset:3px}\n.ri-return-to-reference{position:fixed;z-index:2147481800;right:20px;bottom:calc(92px + env(safe-area-inset-bottom, 0px));display:none;align-items:center;gap:8px;background:#204936;color:#f7dc97;border:1px solid #c6a85b;border-radius:11px;padding:12px 18px;font:inherit;font-size:16px;font-weight:750;box-shadow:0 5px 20px #0008;cursor:pointer}\n.ri-return-to-reference.ri-shown{display:inline-flex}\n@media(max-width:600px){.ri-return-to-reference{right:14px;bottom:calc(94px + env(safe-area-inset-bottom, 0px))}}\n\u003c/style>\u003cstyle id=\"ri-history-style\">#historija{display:flex;flex-direction:column;overflow:hidden}#historija .ri-history-controls{flex:none;padding:12px 15px;background:#0b3025;border-bottom:1px solid #c7a65855}#historija h2{margin:0 0 10px;font-size:18px;color:var(--gold)}#historija label{display:block;font-size:12px;color:var(--gold);margin-bottom:5px}#historija select{width:100%;min-height:42px}#historija .ri-history-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px}#historija button{padding:9px 7px;min-height:40px;border:1px solid #c7a65855;background:#173c2b;color:#f4ecd2;border-radius:9px;font-size:12px}#historija button:disabled{opacity:.4}#ri-history-position{font-size:11px;color:var(--gold);text-align:center}#ri-history-frame{display:block;border:0;width:100%;flex:1;min-height:0;background:#09291f}\u003c/style>\u003cscript type=\"application/json\" id=\"ri-module-config\">{\"route\": \"ehlibejt\", \"defaultHash\": \"ehlibejt\", \"files\": {\"home\": \"index.html\", \"romane\": \"readers/curani.html\", \"bosanski\": \"readers/bosanski.html\", \"listen\": \"readers/sun_curani.html\", \"latin\": \"readers/ar_latinica.html\", \"izgovor\": \"readers/sar_te_citine.html\", \"ri-flight\": \"readers/offline.html\", \"bookmarks\": \"readers/pamtime.html\", \"amendar\": \"amendar.html\", \"tefsir\": \"tefsirja.html\", \"hadis\": \"hadisja.html\", \"ehlibejt\": \"ehli_bejt.html\", \"historija\": \"taberi/historija.html\", \"eknjige\": \"e_knjige.html\", \"settings\": \"steluibe.html\"}}\u003c/script>\u003cscript>(()=>{'use strict';\nconst config=JSON.parse(document.getElementById('ri-module-config').textContent),files=config.files;\nconst canonical=r=>({reader:'romane',quran:'romane',tafsir:'tefsir',podrska:'home',aplikacija:'home'})[r]||r;\nconst target=r=>new URL((files[canonical(r)]||files.home)+'#'+r,document.baseURI).href;\nconst same=r=>canonical(r)===config.route||(config.route==='ri-flight'&&r==='home');\nfunction remember(r){\n  const prefix=r==='reader'?'reader':'romane',surah=document.getElementById(prefix+'Surah'),ayah=document.getElementById(prefix+'Ayah');\n  if(canonical(r)==='romane'&&surah&&ayah)try{sessionStorage.setItem('ri-module-reader-target',JSON.stringify({surah:Number(surah.value)||1,ayah:Number(ayah.value)||1}));}catch{}\n}\nfunction go(r){remember(r);location.assign(target(r));}\nwindow.addEventListener('hashchange',e=>{\n  const r=location.hash.slice(1)||config.defaultHash;\n  if(r==='menu')return;\n  if(!same(r)){e.stopImmediatePropagation();go(r);}\n},true);\ndocument.addEventListener('click',e=>{\n  const a=e.target.closest('a');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button>0)return;\n  const r=a.dataset.riMenuRoute||(a.getAttribute('href')?.startsWith('#')?a.getAttribute('href').slice(1):'');\n  if(!r||(!files[canonical(r)]&&r!=='podrska'&&r!=='aplikacija'))return;\n  if(!same(r)){e.preventDefault();e.stopImmediatePropagation();go(r);}\n},true);\ndocument.querySelectorAll('a[data-ri-menu-route]').forEach(a=>a.href=target(a.dataset.riMenuRoute));\nconst requested=location.hash.slice(1);\nif(requested&&requested!=='menu'&&!same(requested)){go(requested);return;}\nif(!requested||requested==='menu'||(config.route==='ri-flight'&&requested==='ri-flight'))history.replaceState(history.state,'','#'+config.defaultHash);\ndocument.addEventListener('DOMContentLoaded',()=>{\n  if(config.route==='romane')try{\n    const saved=JSON.parse(sessionStorage.getItem('ri-module-reader-target')||'null');\n    sessionStorage.removeItem('ri-module-reader-target');\n    if(saved){const s=document.getElementById('romaneSurah');s.value=String(saved.surah);s.dispatchEvent(new Event('change'));document.getElementById('romaneAyah').value=String(saved.ayah);document.getElementById('romaneOpen').click();}\n  }catch{}\n  if(config.route==='ri-flight'){\n    document.getElementById('ri-flight-menu-link').click();\n    const overlay=document.getElementById('ri-flight-overlay');\n    new MutationObserver(()=>{if(overlay.hidden)location.assign(target('home'));}).observe(overlay,{attributes:true,attributeFilter:['hidden']});\n  }\n});\nif('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register(new URL('offline-sw.js',document.baseURI).href,{scope:new URL('./',document.baseURI).href}).catch(()=>{});\n})();\u003c/script>\u003cscript>(()=>{'use strict';const $=id=>document.getElementById(id);\nfunction closeMenu(){const wasOpen=!$('mainMenu').hidden;$('mainMenu').hidden=true;$('dismissMenu').hidden=true;$('app').classList.remove('menu-open');$('menuToggle').setAttribute('aria-expanded','false');if(wasOpen)$('menuToggle').focus({preventScroll:true})}\nfunction openMenu(){$('mainMenu').hidden=false;$('dismissMenu').hidden=false;$('app').classList.add('menu-open');$('menuToggle').setAttribute('aria-expanded','true');$('closeMenu').focus({preventScroll:true})}\n$('menuToggle').addEventListener('click',()=>{$('mainMenu').hidden?openMenu():closeMenu()});$('closeMenu').addEventListener('click',closeMenu);$('dismissMenu').addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if(e.key==='Tab'&&!$('mainMenu').hidden){const list=[...$('mainMenu').querySelectorAll('button,a')];if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}});\ndocument.querySelectorAll('#mainMenu a').forEach(a=>a.addEventListener('click',closeMenu));\n\nfunction route(){const name=location.hash.slice(1)||'home';if(name==='menu'){openMenu();return;}document.querySelectorAll('.page').forEach(p=>p.hidden=p.id!==name);closeMenu();}\nwindow.addEventListener('hashchange',route);route();\ntry{const settings=JSON.parse(localStorage.getItem('romano-settings-v2')||'{}');if(settings.ar)document.documentElement.style.setProperty('--ar',settings.ar+'px');if(settings.bs)document.documentElement.style.setProperty('--bs',settings.bs+'px');document.body.classList.toggle('no-translation',settings.translation===false);document.body.classList.toggle('no-pronunciation',settings.pronunciation===false);document.body.classList.toggle('side-by-side',settings.layout==='side');}catch{}\ndocument.querySelectorAll('[data-unified-read]').forEach(b=>b.addEventListener('click',()=>{try{sessionStorage.setItem('ri-module-reader-target',JSON.stringify({surah:Number(b.dataset.unifiedRead)||1,ayah:1}));}catch{}location.assign(new URL('readers/curani.html#romane',document.baseURI).href);}));\n})();\u003c/script>\u003cscript id=\"ri-unified-menu-script\">(()=>{'use strict';\nconst routes=[[\"home\", \"⌂\", \"Angluni Strana\"], [\"romane\", \"▤\", \"Čitin o Kur’ani\"], [\"bosanski\", \"◖))\", \"Šun hem Čitin o Kur’ani bosanski\"], [\"listen\", \"◖))\", \"Šun o Kur’ani\"], [\"latin\", \"☷\", \"Šun hem Čitin Arapski Latinica\"], [\"izgovor\", \"Aa\", \"Sar te čitine i te vačere čisto Arapski\"], [\"ri-flight\", \"✈\", \"Kur’an Offline ko Avioni\"], [\"bookmarks\", \"◇\", \"Pamtime Ajetja\"], [\"amendar\", \"◎\", \"Amendar\"], [\"tefsir\", \"▤\", \"Tefsirja\"], [\"hadis\", \"▤\", \"Hadisja\"], [\"ehlibejt\", \"▤\", \"Ehli Bejt\"], [\"historija\", \"▤\", \"Historia\"], [\"eknjige\", \"▤\", \"E-knjige\"], [\"settings\", \"⚙\", \"Šteluibe\"]];\nconst drawer=document.getElementById('mainMenu')||document.getElementById('portalDrawer');if(!drawer)return;\nconst host=document.getElementById('portalDrawer'),isPortal=!!host;\nfunction closePortal(){if(!isPortal)return;host.hidden=true;document.getElementById('portalDrawerShade').hidden=true;document.getElementById('portalMenuToggle').setAttribute('aria-expanded','false');document.body.style.overflow='';}\nfunction active(){const original=location.hash.slice(1)||'home',hash=({quran:'reader',tafsir:'tefsir'})[original]||original;for(const link of drawer.querySelectorAll('[data-ri-menu-route]'))link.dataset.riMenuRoute===hash?link.setAttribute('aria-current','page'):link.removeAttribute('aria-current');}\ndrawer.addEventListener('click',e=>{\n const link=e.target.closest('[data-ri-menu-route]');if(!link)return;const route=link.dataset.riMenuRoute;\n if(isPortal){e.preventDefault();closePortal();window.riPortalNavigate(route);return;}\n if(window.parent!==window&&document.documentElement.dataset.riEmbedded==='true'&&['amendar','podrska','historija','ehlibejt','aplikacija','eknjige'].includes(route)){\n  e.preventDefault();window.parent.postMessage({type:'ri-menu-route',route},location.origin);return;\n }\n});\nwindow.addEventListener('hashchange',active);active();\n})();\n\u003c/script>\u003c/body>\u003c/html>", "root": "./", "portal": false, "extra": true}</script>
