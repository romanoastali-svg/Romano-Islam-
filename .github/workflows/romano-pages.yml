name: Objavi ROMANO ISLAM i katalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: romano-islam-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'romanoastali-svg/Romano-Islam-' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify automatic app updates
        run: bash .github/app-update/check.sh
      - name: Pripremi web i generiši katalog
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site --exclude=.github --exclude=tools --exclude='index 1.html'
          python3 .github/data/build_catalog.py _site
          python3 .github/app-update/build_update.py _site _site/app-update --prepare .github/android/prepare_assets.py --source-home index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: _site

  publish:
    needs: build
    if: github.repository == 'romanoastali-svg/Romano-Islam-' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Sačekaj dostupnost paketa za objavu
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          expected = os.environ['EXPECTED_ARTIFACT_ID']
          if not expected.isdigit():
              raise SystemExit('Upload nije vratio ID paketa za objavu.')
          url = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
                 + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts?name=github-pages')
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      artifacts = json.load(response)['artifacts']
                  if any(str(item['id']) == expected and item['name'] == 'github-pages'
                         and not item['expired'] for item in artifacts):
                      print('Paket github-pages je dostupan za objavu.')
                      break
              except (urllib.error.URLError, TimeoutError, ValueError, KeyError):
                  print('GitHub još nije potvrdio dostupnost paketa.')
              if attempt == 23:
                  raise SystemExit('Paket još nije dostupan; objava nije pokrenuta.')
              time.sleep(5)
          PY
      - uses: actions/deploy-pages@v4
        id: deployment
