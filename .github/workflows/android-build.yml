name: Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Prepare Android tools
        run: bash .github/android/toolchain.sh
      - name: Verify automatic app updates
        run: bash .github/app-update/check.sh
      - name: Build AAB
        run: bash .github/android/build.sh "$GITHUB_WORKSPACE/ROMANO_ISLAM_1_0_10.aab" 11 1.0.10
      - uses: actions/upload-artifact@v4
        with:
          name: ROMANO_ISLAM_1_0_10
          path: ROMANO_ISLAM_1_0_10.aab
